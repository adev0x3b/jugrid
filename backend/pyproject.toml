[project]
name = "jugrid"
version = "0.1.0"
description = "Climate risk for a region's power grid: OpenStreetMap assets, CMIP6 projections, river flood maps."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20",
  "botocore>=1.43",
  "fastapi>=0.162",
  "geoalchemy2>=0.20",
  "h5netcdf>=1.8",
  "h5py>=3.16",
  "httpx>=0.28",
  "numpy>=2.5",
  "psycopg[binary]>=3.3",
  "pydantic-settings>=2.16",
  "rasterio>=1.5",
  "s3fs>=2026.9",
  "shapely>=2.2",
  "sqlalchemy>=2.1",
  "uvicorn[standard]>=0.54",
  "xarray>=2026.9",
  "zarr>=3.4",
]

[project.scripts]
jugrid = "jugrid.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.16",
  "hypothesis>=6.170",
  "mypy>=2.4",
  "pytest>=9.2",
  "respx>=0.23",
  "ruff>=0.17",
  "pandas-stubs>=2.3",
  "types-shapely>=2.1",
  "testcontainers[postgres]>=4.15",
  "pytest-cov>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jugrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs Docker (PostGIS in a container)"]
filterwarnings = ["error::DeprecationWarning", "error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C4", "PL", "TID"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rasterio.*", "s3fs.*", "geoalchemy2.*", "testcontainers.*", "h5netcdf.*", "zarr.*", "respx.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["jugrid"]
omit = ["*/migrations/env.py"]  # runs inside Alembic, measured by the migration tests

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
