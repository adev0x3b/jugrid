name: jugrid

# The app's own containers: a read-only file system with a scratch /tmp, no Linux
# capabilities, and no way to gain privileges.
x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    restart: unless-stopped
    environment:
      POSTGRES_DB: jugrid
      POSTGRES_USER: jugrid
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jugrid}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jugrid -d jugrid"]
      interval: 5s
      timeout: 3s
      retries: 30

  # S3 for the Zarr climate store, as on AWS. SeaweedFS logs a heartbeat every 30 s;
  # `docker compose logs s3` shows it.
  s3:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: server -s3 -dir=/data -volume.max=20 -master.volumeSizeLimitMB=512
    restart: unless-stopped
    attach: false
    volumes:
      - s3:/data
    healthcheck:
      # 127.0.0.1, not localhost: SeaweedFS listens on IPv4 only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  migrate:
    <<: *hardened
    build: ./backend
    command: ["jugrid", "migrate"]
    environment: &env
      JUGRID_DATABASE_URL: postgresql+psycopg://jugrid:${DB_PASSWORD:-jugrid}@db:5432/jugrid
      JUGRID_STORE_URL: s3://jugrid/climate.zarr
      JUGRID_S3_ENDPOINT_URL: http://s3:8333
      JUGRID_PERIOD_YEARS: ${PERIOD_YEARS:-20}
      JUGRID_DOWNLOAD_WORKERS: ${DOWNLOAD_WORKERS:-4}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *hardened
    build: ./backend
    restart: unless-stopped
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy

  web:
    <<: *hardened
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8096}:8080"
    depends_on:
      api:
        condition: service_healthy

  # Fetches the sources and scores every asset: docker compose run --rm ingest
  # The first run downloads about 60 GB of climate files (kept only as the region's cut).
  ingest:
    <<: *hardened
    build: ./backend
    command: ["jugrid", "ingest", "all"]
    profiles: [ingest]
    environment:
      <<: *env
      JUGRID_CACHE_DIR: /cache
    volumes:
      - cache:/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy

volumes:
  db:
  s3:
  cache:
