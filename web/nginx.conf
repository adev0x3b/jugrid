# Behind a Cloudflare Tunnel the connection comes from cloudflared, so the visitor is the
# address Cloudflare puts in CF-Connecting-IP (Cloudflare overwrites whatever a client sends).
# Without it, the connecting address. Only used to rate-limit; nothing logs it.
map $http_cf_connecting_ip $client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# No addresses in the access log: behind a tunnel X-Forwarded-For carries the visitor's IP,
# which nginx's default format would keep.
log_format noip '[$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';

# A visitor loading the map makes about ten API requests; switching scenarios a few more.
limit_req_zone $client zone=api:10m rate=10r/s;
limit_req_zone $client zone=export:10m rate=6r/m;
limit_req_status 429;

# The API answers with Cache-Control: public, max-age=300 (the data changes once a month):
# nginx keeps those answers, as CloudFront does on AWS, so a burst of visitors reads the cache.
proxy_cache_path /tmp/api-cache levels=1:2 keys_zone=api_cache:10m max_size=256m inactive=10m use_temp_path=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout noip;

    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The same headers CloudFront adds in production (infra/cdn.tf).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /api/export.csv {
        limit_req zone=export burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_cache api_cache;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr; # not the chain a client sends
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        # MapLibre's worker is an ES module; browsers refuse it as application/octet-stream.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri /index.html;
    }
}
